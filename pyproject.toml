[project]
name = "calendar-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Prutkow", email = "michael.prutkow@tum.de" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pyobjc-framework-eventkit>=12.2.2",
]

[project.scripts]
calendar-mcp = "calendar_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
]
